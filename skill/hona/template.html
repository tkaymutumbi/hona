<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replace With A Short Name</title>
<meta name="description" content="One sentence on what this page shows and what you need from the reader.">
<style>
  /* Blank canvas. Hona provides no components or look: design this page for its subject.
     Replace every token below. Tokens are defined on :root (light), then redefined for dark under both
     selectors, so the viewer's theme switch works. The body background must come from a token. */
  :root {
    --bg: #ffffff;
    --surface: #f4f4f5;
    --ink: #111111;
    --muted: #666666;
    --line: #dddddd;
    --accent: #2f5fd0;
    --font: system-ui, sans-serif;
    --gutter: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111111; --surface: #1c1c1e; --ink: #f2f2f2; --muted: #a0a0a0; --line: #333333; --accent: #7da2f5; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #111111; --surface: #1c1c1e; --ink: #f2f2f2; --muted: #a0a0a0; --line: #333333; --accent: #7da2f5; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem var(--gutter); background: var(--bg); color: var(--ink); font: 1rem/1.6 var(--font); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .scroll-x { overflow-x: auto; }   /* wrap wide tables, code and frames so the page never scrolls sideways */

  /* Option picks: any element with data-hona-choice="<group>" data-value="<v>" becomes clickable;
     the pick reaches the agent as `choice: <group> = <v>`. Style it however the design needs. */
</style>
</head>
<body>

  <h1>Replace With A Short Name</h1>
  <p>Start from the subject, not from this file.</p>

</body>
